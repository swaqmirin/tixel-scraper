name: Tixel Scraper

on:
  repository_dispatch:
    types: [scrape]          # triggered by cron-job.org every 3 minutes
  workflow_dispatch:         # manual trigger / emergency backup

# Runs share state (which listings were already announced), so never run two at once.
concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Load state from previous run
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: scraper-state-${{ github.run_id }}
          restore-keys: scraper-state-

      - name: Run scraper
        id: scrape
        run: python tixel_scraper.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save state for next run
        if: always() && steps.scrape.outputs.state_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: scraper-state-${{ github.run_id }}-${{ github.run_attempt }}
