name: Weekly Report

on:
  repository_dispatch:
    types: [weekly_report] # triggered by cron-job.org at 9am AWST every Sunday
  workflow_dispatch:       # manual trigger / emergency backup

permissions:
  contents: write          # needed to push the heartbeat commit
  actions: read            # needed to count scraper runs

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Load scraper state (alerts sent this week)
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: scraper-state-${{ github.run_id }}
          restore-keys: scraper-state-

      - name: Send Telegram weekly check-in
        run: python weekly_report.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Heartbeat commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TZ="Australia/Perth" date > heartbeat.txt
          git add heartbeat.txt
          git commit -m "chore: weekly heartbeat [skip ci]"
          git push
