name: Tixel Scraper (fast)

on:
  repository_dispatch:
    types: [scrape_fast]     # triggered by cron-job.org every 15 minutes
  workflow_dispatch:         # manual trigger / emergency backup

# Each run checks every 30 seconds for 55 minutes. Only one runs at a time: the next
# trigger waits in the queue and takes over as soon as the current run ends. GitHub
# cancels any extra trigger that arrives while one is already waiting - that's expected.
# Keeps its own memory (separate from scrape.yml), so each system announces a listing once.
concurrency:
  group: scraper-fast
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install chromium --with-deps --no-shell

      - name: Load state from previous run
        uses: actions/cache/restore@v4
        with:
          path: fast-state.json
          key: fast-state-${{ github.run_id }}
          restore-keys: fast-state-

      - name: Run scraper
        id: scrape
        run: python tixel_scraper.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_FILE: fast-state.json
          RUN_MINUTES: 55

      - name: Save state for next run
        if: always() && steps.scrape.outputs.state_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: fast-state.json
          key: fast-state-${{ github.run_id }}-${{ github.run_attempt }}
